[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "delphi-aou"
version = "0.2.0"
description = "Auditing and modeling disease trajectory models under informative EHR observation (All of Us)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wesley Maia", email = "wesleymaia999@gmail.com" }]
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "pyarrow>=12", "torch>=2.1",
]

[project.optional-dependencies]
aou = ["google-cloud-bigquery", "pandas-gbq", "db-dtypes", "tqdm", "matplotlib"]
replication = ["tqdm"]
cehrgpt = ["cehrgpt==0.1.9", "pyarrow==16.1.0", "datasets"]
paper = ["matplotlib"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
delphi_aou = ["config.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: trains small models, several minutes on CPU"]
